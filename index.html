<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EV BUILD — конфигуратор электромотоцикла</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root{
  --bg:#151517; --bg2:#1B1B1E;
  --glass:rgba(255,255,255,.045); --glass-hi:rgba(255,255,255,.075);
  --brd:rgba(255,255,255,.10); --brd-hi:rgba(255,255,255,.20);
  --hair:rgba(255,255,255,.09);
  --txt:#EDEDE8; --mut:#9B9B94;
  --red:#FF4433; --orange:#FF8A3D; --yellow:#FFC93C;
  --pwr:var(--orange); --trq:var(--yellow);
  --amb:var(--orange); --ok:#FFD86B;
  --disp:'IBM Plex Sans Condensed','Arial Narrow',system-ui,sans-serif;
  --ui:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;min-height:100%}
body{
  background:
    radial-gradient(760px 460px at 8% -8%, rgba(255,68,51,.16), transparent 60%),
    radial-gradient(900px 520px at 96% 6%, rgba(255,138,61,.14), transparent 60%),
    radial-gradient(1000px 620px at 50% 100%, rgba(255,201,60,.08), transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--txt);font-family:var(--ui);font-size:14px;-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:1px;border-radius:4px}

/* ---------- стекло ---------- */
.glass{
  background:var(--glass);
  border:1px solid var(--brd);
  border-radius:16px;
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 10px 30px rgba(0,0,0,.28);
}

/* ---------- шапка ---------- */
header{position:sticky;top:0;z-index:20;padding:14px 22px 0}
.bar{display:flex;align-items:center;gap:20px;padding:11px 18px;margin-bottom:10px}
.mark{font-family:var(--disp);font-weight:700;font-size:20px;letter-spacing:.22em;text-transform:uppercase;white-space:nowrap;
  background:linear-gradient(90deg,#FFD86B,var(--orange) 55%,var(--red));-webkit-background-clip:text;background-clip:text;color:transparent}
.mark b{color:var(--red);-webkit-text-fill-color:var(--red)}
.mark-s{font-size:11px;letter-spacing:.06em;color:var(--mut);margin-top:2px}
.bar-sp{flex:1}
.acts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.btn{background:var(--glass);border:1px solid var(--brd);color:var(--txt);border-radius:9px;
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;padding:7px 12px;
  backdrop-filter:blur(10px)}
.btn:hover{border-color:var(--brd-hi);background:var(--glass-hi)}
.btn.pri{background:linear-gradient(135deg,var(--orange),var(--red));border-color:transparent;color:#1A0E08;font-weight:600}
.btn.pri:hover{filter:brightness(1.08)}
.seg{display:inline-flex;border:1px solid var(--brd);border-radius:9px;overflow:hidden;background:var(--glass)}
.seg button{background:transparent;border:0;border-right:1px solid var(--brd);color:var(--mut);
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;padding:7px 12px}
.seg button:last-child{border-right:0}
.seg button.on{background:linear-gradient(135deg,var(--orange),var(--red));color:#1A0E08;font-weight:600}

.tabs{display:flex;gap:8px;align-items:stretch;overflow-x:auto;padding-bottom:10px}
.tab{display:flex;align-items:center;border-radius:12px;position:relative;flex:none;
  background:var(--glass);border:1px solid var(--brd);backdrop-filter:blur(14px)}
.tab .go{background:transparent;border:0;padding:9px 13px;text-align:left;color:var(--mut)}
.tab .go .nm{font-family:var(--disp);font-size:14px;letter-spacing:.05em;text-transform:uppercase;display:block}
.tab .go .kw{font-family:var(--mono);font-size:10.5px;display:block;margin-top:1px}
.tab.on{border-color:rgba(255,138,61,.55);box-shadow:0 0 0 1px rgba(255,138,61,.18) inset,0 0 22px rgba(255,138,61,.15)}
.tab.on .go{color:var(--txt)}
.tab.on .go .nm{color:var(--orange)}
.tab .rm{background:transparent;border:0;color:var(--mut);padding:0 11px;font-size:16px;line-height:1;align-self:stretch}
.tab .rm:hover{color:var(--red)}
.tab-add{background:var(--glass);border:1px dashed var(--brd);border-radius:12px;color:var(--mut);
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;padding:0 15px}
.tab-add:hover{color:var(--txt);border-color:var(--brd-hi)}
.saved{margin-left:auto;align-self:center;font-family:var(--mono);font-size:10px;color:var(--mut);padding-left:10px;white-space:nowrap}

/* ---------- кластер показателей ---------- */
.cluster{display:grid;grid-template-columns:repeat(6,1fr);margin-bottom:12px;overflow:hidden}
.cl{padding:14px 16px 15px;border-right:1px solid var(--hair)}
.cl:last-child{border-right:0}
.cl-k{font-family:var(--disp);text-transform:uppercase;letter-spacing:.12em;font-size:10.5px;color:var(--mut)}
.cl-v{font-family:var(--mono);font-weight:600;font-size:29px;line-height:1.1;margin-top:5px;letter-spacing:-.02em}
.cl-v u{text-decoration:none;font-size:12px;font-weight:500;color:var(--mut);margin-left:4px}
.cl-s{font-size:11px;color:var(--mut);margin-top:3px}
.cl.pwr .cl-v{color:var(--orange)} .cl.trq .cl-v{color:var(--yellow)}

/* ---------- рабочая область ---------- */
.wrap{display:grid;grid-template-columns:minmax(300px,356px) 1fr;gap:16px;padding:0 22px 44px;align-items:start;max-width:1640px;margin:0 auto}
.col{display:flex;flex-direction:column;gap:12px}

.card>h3{margin:0;display:flex;align-items:center;gap:9px;padding:9px 14px;border-bottom:1px solid var(--hair);
  font-family:var(--disp);font-size:15px;text-transform:uppercase;letter-spacing:.1em;font-weight:600}
.card>h3 .ix{font-family:var(--mono);font-size:10px;background:linear-gradient(135deg,var(--yellow),var(--orange));
  color:#1A0E08;padding:2px 6px;line-height:1;border-radius:5px;font-weight:600}
.card>h3 .sp{margin-left:auto;font-family:var(--ui);text-transform:none;letter-spacing:0;font-size:12px;font-weight:400}
.pad{padding:10px 14px 13px}

.row{display:flex;align-items:baseline;gap:7px;padding:4px 0;font-size:13px}
.row .lb{white-space:nowrap;color:var(--txt)}
.row .lb i{display:block;font-style:normal;font-size:10.5px;color:var(--mut);line-height:1.25}
.row .dt{flex:1;border-bottom:1px dotted var(--brd);transform:translateY(-3px)}
.row .fd{display:flex;align-items:baseline;gap:5px}
.row .un{font-family:var(--mono);font-size:10.5px;color:var(--mut);min-width:26px}
input[type=text]{width:78px;text-align:right;font-family:var(--mono);font-size:13px;padding:4px 7px;
  border:1px solid var(--brd);background:rgba(255,255,255,.05);color:var(--txt);border-radius:7px}
input[type=text]:focus{border-color:var(--brd-hi);background:rgba(255,255,255,.08)}
input[type=text]::placeholder{color:#5B5B57}
input.txt{width:100%;text-align:left}
select{width:100%;font-size:13px;padding:7px 9px;border:1px solid var(--brd);background:rgba(255,255,255,.05);
  color:var(--txt);margin-bottom:8px;border-radius:8px}
select option{background:#212124;color:var(--txt)}
.tog{display:flex;width:100%;border:1px solid var(--brd);border-radius:9px;overflow:hidden;margin:2px 0 9px}
.tog button{flex:1;background:transparent;border:0;border-right:1px solid var(--brd);padding:6px;
  font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:11.5px;color:var(--mut)}
.tog button:last-child{border-right:0}
.tog button.on{background:linear-gradient(135deg,var(--orange),var(--red));color:#1A0E08;font-weight:600}
.tog.mini button{padding:4px 6px;font-size:11px}
.trip{display:flex;gap:7px;margin:5px 0}
.trip div{flex:1}
.trip span{display:block;font-family:var(--mono);font-size:10px;color:var(--mut);margin-bottom:2px}
.trip input{width:100%}
.note-s{font-family:var(--mono);font-size:11px;color:var(--mut);line-height:1.55;
  background:rgba(255,201,60,.06);border:1px solid rgba(255,201,60,.14);border-radius:9px;padding:7px 9px;margin:7px 0}
.note-s b{color:var(--txt);font-weight:600}
.lnk{background:transparent;border:0;padding:4px 0;font-family:var(--disp);text-transform:uppercase;
  letter-spacing:.08em;font-size:11.5px;color:var(--yellow)}
.xrow{display:flex;gap:6px;margin-bottom:6px}
.xrow input.txt{flex:1;width:auto}
.mini-b{border:1px solid var(--brd);background:var(--glass);font-family:var(--disp);text-transform:uppercase;
  font-size:11px;letter-spacing:.06em;padding:4px 9px;color:var(--mut);border-radius:7px}
.mini-b:hover{border-color:var(--brd-hi);color:var(--txt)}

/* предупреждения */
.warns{display:flex;flex-direction:column;gap:8px}
.warn{display:flex;gap:10px;align-items:flex-start;padding:9px 13px;font-size:12.5px;line-height:1.42;border-radius:12px}
.warn s{width:3px;align-self:stretch;flex:none;text-decoration:none;border-radius:2px}
.warn.red{background:rgba(255,68,51,.09);border:1px solid rgba(255,68,51,.28);color:#FFB2A8}
.warn.red s{background:var(--red)}
.warn.amb{background:rgba(255,138,61,.09);border:1px solid rgba(255,138,61,.26);color:#FFC69A}
.warn.amb s{background:var(--orange)}
.warn.inf{background:rgba(255,201,60,.07);border:1px solid rgba(255,201,60,.20);color:#E9D48C}
.warn.inf s{background:var(--yellow)}
.warn.ok{background:rgba(255,216,107,.06);border:1px solid rgba(255,216,107,.20);color:#E9D48C}
.warn.ok s{background:var(--ok)}

/* карточки результатов */
.outs{display:grid;grid-template-columns:repeat(auto-fit,minmax(268px,1fr));gap:12px}
.l2{display:flex;align-items:baseline;gap:6px;font-size:12.5px;padding:3.5px 0}
.l2 .k{color:var(--mut)}
.l2 .d{flex:1;border-bottom:1px dotted var(--hair);transform:translateY(-3px)}
.l2 .v{font-family:var(--mono);font-size:12.5px;white-space:nowrap;color:var(--txt)}
.v.pwr{color:var(--orange);font-weight:600} .v.trq{color:var(--yellow);font-weight:600}
.v.red{color:var(--red);font-weight:600} .v.amb{color:var(--orange);font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:9px 0 5px;padding:9px 10px;
  border-radius:10px;background:linear-gradient(135deg,rgba(255,138,61,.14),rgba(255,68,51,.10));
  border:1px solid rgba(255,138,61,.25)}
.total span{font-family:var(--disp);text-transform:uppercase;letter-spacing:.1em;font-size:14px}
.total b{font-family:var(--mono);font-size:18px;color:#FFD8B0}
.foot{font-size:11.5px;color:var(--mut);line-height:1.6;max-width:82ch;margin:2px 0 0}

/* сравнение */
.cmp{padding:0 22px 44px;max-width:1640px;margin:0 auto}
.cmp-in{overflow-x:auto;border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 14px;text-align:right;font-family:var(--mono);white-space:nowrap;border-bottom:1px solid var(--hair)}
th{border-bottom:1px solid var(--brd-hi);font-family:var(--disp);text-transform:uppercase;letter-spacing:.08em;font-size:14px}
td.k,th.k{text-align:left;font-family:var(--ui);color:var(--mut)}
th.k{color:var(--txt)}
td.best{background:rgba(255,201,60,.10);color:#FFE49E;font-weight:600;border-radius:6px}
.cmp-open{background:transparent;border:0;font:inherit;color:var(--orange);text-transform:uppercase}
.cmp-ft{display:flex;justify-content:space-between;gap:14px;padding:11px 4px 0;font-size:11.5px;color:var(--mut)}

.hidden{display:none!important}

@media (max-width:1100px){
  .wrap{grid-template-columns:1fr}
  .cluster{grid-template-columns:repeat(3,1fr)}
  .cl:nth-child(3){border-right:0}
}
@media (max-width:640px){
  header{padding:12px 12px 0}
  .bar{flex-wrap:wrap;gap:10px;padding:10px 12px}
  .wrap,.cmp{padding-left:12px;padding-right:12px}
  .cluster{grid-template-columns:repeat(2,1fr)}
  .cl:nth-child(3){border-right:1px solid var(--hair)}
  .cl-v{font-size:24px}
  input[type=text]{width:68px}
}
#sheet{display:none}
@page{size:A4 landscape;margin:7mm}
@media print{
  html,body{background:#fff!important;color:#000}
  body>*:not(#sheet){display:none!important}
  #sheet{display:block;font-size:11px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  :root{--txt:#000;--mut:#333;--hair:#aaa;--brd:#999}
  #sheet .sh-h{display:flex;gap:14px;align-items:baseline;border-bottom:2px solid #000;padding-bottom:4px;margin-bottom:8px;font-size:12px}
  #sheet .sh-h b{font:700 18px var(--disp);letter-spacing:.2em}
  #sheet .sh-h span:last-child{margin-left:auto}
  #sheet .cluster{border:1.5px solid #000;border-radius:0;margin-bottom:8px;background:#fff;box-shadow:none;backdrop-filter:none}
  #sheet .cluster{grid-template-columns:repeat(6,1fr)!important}
  #sheet .cl{padding:6px 10px;border-color:#999;border-right:1px solid #999!important}
  #sheet .cl-k{font-size:9.5px;color:#333}
  #sheet .cl-v{font-size:22px;color:#000!important}
  #sheet .cl-v u,#sheet .cl-s{color:#333;font-size:10px}
  #sheet .warns{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  #sheet .warn{padding:3px 8px;font-size:10.5px;background:#fff!important;border:1px solid #999;border-left:4px solid #e80;border-radius:0;color:#000!important}
  #sheet .warn.red{border-left-color:#c00} #sheet .warn.ok{border-left-color:#3a3}
  #sheet .warn s{display:none}
  #sheet .sh-row{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
  #sheet .sh{border:1.5px solid #000;break-inside:avoid}
  #sheet .sh h4{margin:0;padding:3px 8px;background:#111;color:#fff;font:600 11px var(--disp);letter-spacing:.12em;text-transform:uppercase}
  #sheet .sh>div{padding:3px 8px 5px}
  #sheet .l2{font-size:11px;padding:2px 0}
  #sheet .l2 .k{color:#222}
  #sheet .l2 .v{white-space:nowrap;text-align:right;color:#000!important;font-size:11px}
  #sheet .l2 .k{min-width:0}
  #sheet .total{display:flex;justify-content:space-between;border-top:1.5px solid #000;margin-top:3px;padding-top:3px;font-size:14px;font-weight:700;background:#fff!important;border-radius:0!important;border-left:0!important;border-right:0!important;border-bottom:0!important;box-shadow:none!important}
  #sheet .total b,#sheet .total span{color:#000!important;background:none!important;-webkit-text-fill-color:#000!important}
  #sheet .sh-t{font:700 12px var(--disp);letter-spacing:.14em;text-transform:uppercase;border-bottom:2px solid #000;margin:2px 0 6px}
  body.ex-min .sh-tech{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div id="sheet" data-dyn></div>
<!--Сделал (тг)@FedorKkudrin-->
<header>
  <div class="bar glass">
    <div>
      <div class="mark">EV<b>·</b>BUILDER</div>
      <div class="mark-s">Конфигуратор компонентов электротранспорта</div>
    </div>
    <div class="bar-sp"></div>
    <div class="acts">
      <div class="seg" id="langSeg"></div>
      <div class="seg" id="curSeg"></div>
      <div class="seg" id="viewSeg"></div>
      <div class="seg" id="exSeg" title="Что попадёт в печать"></div>
      <button class="btn" data-act="print">Печать</button>
      <button class="btn" data-act="json">Экспорт JSON</button>
      <button class="btn" data-act="import">Импорт</button>
      <button class="btn pri" data-act="savefile">Сохранить копию файла</button>
    </div>
  </div>
  <nav class="tabs" id="tabs" data-dyn></nav>
  <section class="cluster glass" id="cluster" data-dyn></section>
</header>

<main class="wrap" id="wrap">
  <div class="col" id="inputs" data-dyn></div>
  <div class="col" id="outputs" data-dyn></div>
</main>

<section class="cmp hidden" id="cmp" data-dyn></section>

<input type="file" id="file" accept=".json,.html" class="hidden">
<script id="seed" type="application/json">null</script>

function tr(s){
  if(!CYR.test(s)) return s;

  if(TR_X.hasOwnProperty(t)) return s.replace(t,function(){return TR_X[t];});
  var i; for(i=0;i<TR_R.length;i++) s=s.replace(TR_R[i][0],TR_R[i][1]);
  for(i=0;i<TR_PK.length;i++) if(s.indexOf(TR_PK[i])>-1) s=s.split(TR_PK[i]).join(TR_P[TR_PK[i]]);

function walk(root){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null), n, list=[], en=LANG==="en";
  while((n=w.nextNode())) list.push(n);
  list.forEach(function(n){
    var p=n.parentNode; if(p&&(p.nodeName==="SCRIPT"||p.nodeName==="STYLE")) return;
    if(en){ if(CYR.test(n.data)){ if(!ORIG.has(n)) ORIG.set(n,n.data); n.data=tr(n.data); } }
    else if(ORIG.has(n)){ n.data=ORIG.get(n); ORIG.delete(n); }
  });
  Array.prototype.forEach.call(root.querySelectorAll("[placeholder],[title]"),function(el){
    var o=ORIGA.get(el)||{}; ["placeholder","title"].forEach(function(a){
      var v=el.getAttribute(a); if(v===null) return;
      if(en){ if(CYR.test(v)){ o[a]=v; el.setAttribute(a,tr(v)); } }
      else if(o[a]!==undefined){ el.setAttribute(a,o[a]); delete o[a]; }
    }); ORIGA.set(el,o);
  });
  if(en) Array.prototype.forEach.call(root.querySelectorAll("input.txt"),function(el){
    if(el!==document.activeElement && CYR.test(el.value)) el.value=tr(el.value);
  });
}

  {id:"liion",  label:"Li-ion NMC 18650 / 21700", nom:3.6, max:4.2, min:3.0},
  {id:"lifepo", label:"LiFePO4",                  nom:3.2, max:3.65,min:2.6},
  {id:"lipo",   label:"Li-Po",                    nom:3.7, max:4.2, min:3.3}
];

/* ================================================================
   УТИЛИТЫ
   ================================================================ */
function N(x,d){ var v = parseFloat(String(x).replace(",",".")); return isFinite(v) ? v : (d||0); }
function fmt(x,d){ d = d===undefined?1:d; return isFinite(x) ? x.toLocaleString(LANG==="en"?"en-US":"ru-RU",{minimumFractionDigits:d,maximumFractionDigits:d}) : "—"; }
function f0(x){ return fmt(x,0); }
function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function money(x){ return x>0 ? f0(x)+" "+state.cur : "—"; }
function uid(){ return "b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6); }

function makeBuild(name){
  var m = MOTORS[0], c = CONTROLLERS[0];
  return {
    id: uid(), name: name,
    motor:{preset:m.id,label:m.label,type:m.type,kv:m.kv,rPhase:m.rPhase,maxRpm:m.maxRpm,maxPhaseA:m.maxPhaseA,contW:m.contW,peakW:m.peakW,kg:m.kg,ratio:m.ratio,tShaft:"",tGear:"",price:""},
    ctrl:{preset:c.id,label:c.label,maxV:c.maxV,maxPhaseA:c.maxPhaseA,maxBattA:c.maxBattA,kg:c.kg,price:""},
    batt:{name:"",chem:"custom",s:"",cellNom:"",cellMax:"",cellMin:"",ah:"",maxA:"",rInt:"",kg:"",chargerKw:"",price:""},
    trans:{front:m.front,rear:m.rear},
    wheel:{rim:17,width:150,aspect:60},
    bike:{frameKg:55,riderKg:80,cda:0.55,crr:0.015,mu:0.8,soc:"nom",dod:90,etaM:90,etaC:97,etaD:95,kSat:90,fw:135},
    extras:[{name:"Рама / маятник",price:""},{name:"Подвеска",price:""},{name:"Тормоза",price:""},{name:"Колёса и резина",price:""},{name:"Проводка, BMS, мелочь",price:""}]
  };
}

/* ================================================================
   РАСЧЁТ
   ================================================================ */
function compute(b){
  var g=9.80665, rho=1.225;
  var m=b.motor, c=b.ctrl, bt=b.batt, tr=b.trans, wh=b.wheel, bk=b.bike;

  var s = Math.max(N(bt.s,1),1);
  var vMax=s*N(bt.cellMax,4.2), vNom=s*N(bt.cellNom,3.6), vMin=s*N(bt.cellMin,3.0);
  var vWork = bk.soc==="max"?vMax : bk.soc==="min"?vMin : vNom;

  var kv=Math.max(N(m.kv,1),0.1), kt=9.5493/kv;
  var rPh=N(m.rPhase,0)/1000, rInt=N(bt.rInt,0)/1000;
  var iPh=Math.min(N(c.maxPhaseA,0), N(m.maxPhaseA,1e9));
  var iBat=Math.min(N(c.maxBattA,0), N(bt.maxA,1e9));
  var vSag=Math.max(vWork-iBat*rInt,1), sagPct=(vWork-vSag)/vWork*100;

  var etaM=N(bk.etaM,90)/100, etaC=N(bk.etaC,97)/100, etaD=N(bk.etaD,95)/100;
  var pElec=vSag*iBat, pShaft=pElec*etaC*etaM, pWheel=pShaft*etaD;

  var isHub = m.type==="hub";
  var chain = isHub?1:N(tr.rear,1)/Math.max(N(tr.front,1),0.001);
  var gearbox = isHub?1:N(m.ratio,1);
  var gearboxSafe = Math.max(gearbox,0.01);
  var ratio = gearbox*chain;
<!--Cделал (тг)@FedorKkudrin-->
  var kSat=N(bk.kSat,90)/100;
  var tMaxRaw=kt*iPh;
  var tShaftIn=N(m.tShaft,0), tGearIn=isHub?0:N(m.tGear,0);
  var tMax, tSrc;
  if(!isHub && tGearIn>0){ tMax=tGearIn/gearboxSafe; tSrc="gear"; }
  else if(tShaftIn>0){ tMax=tShaftIn; tSrc="shaft"; }
  else { tMax=tMaxRaw*kSat; tSrc="calc"; }
  var tGearOut = tMax*gearbox;

  var vAvail=vSag*0.95;
  var n1=Math.max(kv*(vAvail-iPh*rPh*1.5),10);
  var nBase=kv*vAvail;
  var nFw=nBase*(N(bk.fw,135)/100);
  var nMech=N(m.maxRpm,1e9);
  var nMax=Math.min(nFw,nMech);
  var fwByMech = nFw>nMech;

  var rW=(N(wh.rim,17)*25.4/2 + N(wh.width,150)*N(wh.aspect,60)/100)/1000;
  var circ=2*Math.PI*rW;

  var mass=N(bk.frameKg,0)+N(bk.riderKg,0)+N(m.kg,0)+N(bt.kg,0)+N(c.kg,0);
  var massBike=mass-N(bk.riderKg,0);
  var cda=N(bk.cda,0.55), crr=N(bk.crr,0.015), mu=N(bk.mu,0.8);
  var fTr=mu*mass*g;

  function torqueAt(n){
    var tv = n<=n1 ? tMax : tMax*Math.max(0,(nMax-n)/Math.max(nMax-n1,1));
    var w = 2*Math.PI*n/60;
    var tp = n<1 ? tMax : pShaft/w;
    return Math.max(0, Math.min(tMax,tv,tp));
  }
  function speedAt(n){ return circ*(n/ratio)/60; }
  function forceAt(n){ return torqueAt(n)*ratio*etaD/rW; }
  function resAt(v){ return 0.5*rho*cda*v*v + crr*mass*g; }

  var tWheelMax=0, fWheelMax=0, i, n, STEPS=160;
  for(i=0;i<=STEPS;i++){
    n = nMax*i/STEPS;
    var tW = torqueAt(n)*ratio*etaD, fW = forceAt(n);
    if(tW>tWheelMax) tWheelMax=tW;
    if(fW>fWheelMax) fWheelMax=fW;
  }

  var vTop=0;
  for(i=0;i<=STEPS;i++){
    n = nMax*i/STEPS;
    var v=speedAt(n)*3.6;
    if(forceAt(n)>=resAt(speedAt(n))) vTop=v;
  }
  var vRpm=speedAt(nMax)*3.6;
  var dragLim = vTop < vRpm-0.5;
  var vTopF = Math.min(vTop>0?vTop:vRpm, vRpm);
  var vNoFw = speedAt(Math.min(nBase,nMech))*3.6;

  var t60=null,t100=null,tt=0,vv=0,dt=0.005;
  while(tt<60){
    var nn=vv*60*ratio/circ;
    if(nn>nMax) break;
    var f=Math.min(forceAt(nn),fTr);
    var a=(f-resAt(vv))/mass;
    if(a<=0.01 && vv>1) break;
    vv+=a*dt; tt+=dt;
    if(t60===null && vv>=60/3.6) t60=tt;
    if(t100===null && vv>=100/3.6) t100=tt;
    if(t100!==null && vv>vTopF/3.6-0.4) break;
  }

  var nClimb=Math.min((10/3.6)*60*ratio/circ, nMax);
  var fClimb=Math.min(forceAt(nClimb),fTr), grade=0;
  for(var deg=0;deg<=45;deg+=0.25){
    var th=deg*Math.PI/180;
    if(fClimb >= mass*g*(Math.sin(th)+crr*Math.cos(th))) grade=Math.tan(th)*100;
  }

  var kwh=vNom*N(bt.ah,0)/1000, usable=kwh*(N(bk.dod,90)/100);
  var cReq = N(bt.ah,0)>0 ? iBat/N(bt.ah,0) : 0;
  var cMax = N(bt.ah,0)>0 ? N(bt.maxA,0)/N(bt.ah,0) : 0;
  function rangeAt(kmh){
    var vv2=kmh/3.6, pRoad=resAt(vv2)*vv2, pB=pRoad/(etaD*etaM*etaC), wpk=pB/kmh;
    return {wpk:wpk, km: wpk>0 ? usable*1000/wpk : 0};
  }
  var r50=rangeAt(50), r70=rangeAt(70), r90=rangeAt(90);
  var chargeH = N(bt.chargerKw,0)>0 ? kwh/N(bt.chargerKw,0) : null;

  var extras=0;
  (b.extras||[]).forEach(function(e){ extras+=N(e.price,0); });
  var total=N(m.price,0)+N(c.price,0)+N(bt.price,0)+extras;

  var haveCtrl = N(c.maxV,0)>0, haveBattA = N(bt.maxA,0)>0, haveMotA = N(m.maxPhaseA,0)>0;
  var warn=[];
  if(haveCtrl && vMax>N(c.maxV,0)) warn.push({l:"red",t:"Батарея на полном заряде "+fmt(vMax,1)+" В — выше предела контроллера "+f0(N(c.maxV,0))+" В. Меньше ячеек или другой контроллер."});
  else if(haveCtrl && vMax>N(c.maxV,0)*0.95) warn.push({l:"amb",t:"Полный заряд "+fmt(vMax,1)+" В почти упирается в предел контроллера "+f0(N(c.maxV,0))+" В — запаса нет."});
  if(haveBattA && N(c.maxBattA,0)>0 && N(bt.maxA,0)<N(c.maxBattA,0)) warn.push({l:"amb",t:"Ток режет батарея: "+f0(N(bt.maxA,0))+" А против "+f0(N(c.maxBattA,0))+" А у контроллера. Теряется "+f0((1-N(bt.maxA,0)/Math.max(N(c.maxBattA,0),1))*100)+" % мощности."});
  if(haveMotA && N(c.maxPhaseA,0)>0 && N(m.maxPhaseA,0)<N(c.maxPhaseA,0)) warn.push({l:"amb",t:"Фазный ток режет мотор: "+f0(N(m.maxPhaseA,0))+" А против "+f0(N(c.maxPhaseA,0))+" А у контроллера."});
  if(N(m.peakW,0)>0 && pShaft>N(m.peakW,1e9)) warn.push({l:"red",t:"На валу "+fmt(pShaft/1000,1)+" кВт при паспортном пике "+fmt(N(m.peakW,0)/1000,1)+" кВт. Так можно только секундами."});
  else if(N(m.contW,0)>0 && pShaft>N(m.contW,1e9)*2) warn.push({l:"amb",t:"Пик "+fmt(pShaft/1000,1)+" кВт — более чем вдвое выше длительных "+fmt(N(m.contW,0)/1000,1)+" кВт. Точно не треснешь?"});
  if(sagPct>12 && rInt>0) warn.push({l:"amb",t:"Просадка под полным током "+fmt(sagPct,1)+" % (до "+fmt(vSag,1)+" В). Внутреннее сопротивление сборки великовато."});
  if(cReq>cMax && cMax>0) warn.push({l:"red",t:"Требуется "+fmt(cReq,1)+" C, батарея отдаёт "+fmt(cMax,1)+" C."});
  if(fwByMech && nMech<1e8) warn.push({l:"inf",t:"Механический потолок "+f0(nMech)+" об/мин наступает раньше электрического ("+f0(nFw)+" об/мин) — весь запас ослабления поля не выберется."});
  if(fWheelMax>fTr && fTr>0) warn.push({l:"inf",t:"Тяга "+f0(fWheelMax)+" Н выше принятого предела сцепления/вилли "+f0(fTr)+" Н — Бернаут на низах)))"});

  return {vMax:vMax,vNom:vNom,vMin:vMin,vWork:vWork,vSag:vSag,sagPct:sagPct,s:s,
    kt:kt,iPh:iPh,iBat:iBat,pElec:pElec,pShaft:pShaft,pWheel:pWheel,
    tMaxRaw:tMaxRaw,tMax:tMax,tSrc:tSrc,tGearOut:tGearOut,tWheelMax:tWheelMax,fWheelMax:fWheelMax,fTr:fTr,
    fUse:Math.min(fWheelMax,fTr),tractionLim:fWheelMax>fTr,
    n1:n1,nBase:nBase,nFw:nFw,nMax:nMax,nMech:nMech,fwByMech:fwByMech,
    ratio:ratio,gearbox:gearbox,chain:chain,isHub:isHub,rW:rW,circ:circ,
    mass:mass,massBike:massBike,kmhN1:speedAt(n1)*3.6,
    vTop:vTopF,vRpm:vRpm,vNoFw:vNoFw,dragLim:dragLim,t60:t60,t100:t100,grade:grade,
    kwh:kwh,usable:usable,cReq:cReq,cMax:cMax,r50:r50,r70:r70,r90:r90,chargeH:chargeH,
    total:total,extras:extras,perKw:pWheel>0?total/(pWheel/1000):0,perKwh:kwh>0?total/kwh:0,
    wPerKg:mass>0?pWheel/mass:0,warn:warn};
}

/* ================================================================
   СОСТОЯНИЕ И ХРАНЕНИЕ
   ================================================================ */
var KEY="evbuild.v2";
var state={builds:[makeBuild("Сборка 1")],active:0,cur:"₽",view:"build",adv:false,ts:Date.now()};
var mem=null, saveTimer=null, where="";

function pack(){ state.ts=Date.now(); return JSON.stringify({builds:state.builds,active:state.active,cur:state.cur,ts:state.ts}); }
function apply(d){
  if(!d||!d.builds||!d.builds.length) return false;
  state.builds=d.builds; state.active=Math.min(d.active||0,d.builds.length-1);
  state.cur=d.cur||"₽"; state.ts=d.ts||0; return true;
}
function saveNow(){
  var s=pack(), okLocal=false, okApp=false;
  try{ localStorage.setItem(KEY,s); okLocal=true; }catch(e){ mem=s; }
  if(window.storage&&window.storage.set){
    try{ var pr=window.storage.set(KEY,s); if(pr&&pr.catch) pr.catch(function(){}); okApp=true; }catch(e2){}
  }
  where = okApp ? "хранилище приложения" : okLocal ? "браузер помнит этот файл" : "не сохраняется — жмите «Сохранить копию файла»";
  var el=document.getElementById("savedTag");
  if(el) el.textContent = (okApp||okLocal ? "сохранено "+new Date().toLocaleTimeString("ru-RU",{hour:"2-digit",minute:"2-digit"})+" · " : "") + where;
}
function scheduleSave(){ clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,500); }

function boot(){
  var seed=null, local=null;
  try{ var raw=document.getElementById("seed").textContent.trim(); if(raw&&raw!=="null") seed=JSON.parse(raw); }catch(e){}
  try{ var l=localStorage.getItem(KEY); if(l) local=JSON.parse(l); }catch(e){}
  var pick = (local&&seed) ? ((local.ts||0)>=(seed.ts||0)?local:seed) : (local||seed);
  if(pick) apply(pick);
  if(window.storage&&window.storage.get){
    window.storage.get(KEY).then(function(r){
      if(r&&r.value){ var d=JSON.parse(r.value); if((d.ts||0)>(state.ts||0)){ apply(d); renderAll(); } }
    }).catch(function(){});
  }
}

var $=function(id){ return document.getElementById(id); };
function cur(){ return state.builds[Math.min(state.active,state.builds.length-1)]; }

function set(path,val){
  var p=path.split("."), o=cur(), i;
  for(i=0;i<p.length-1;i++) o=o[p[i]];
  o[p[p.length-1]]=val;
}

function rowHtml(label,path,unit,hint,val,idAttr){
  return '<label class="row"><span class="lb">'+label+(hint?'<i>'+hint+'</i>':'')+'</span>'+
    '<span class="dt"></span><span class="fd">'+
    '<input type="text" inputmode="decimal" data-p="'+path+'" value="'+esc(val)+'" placeholder="—">'+
    (unit?'<span class="un">'+unit+'</span>':'<span class="un"></span>')+'</span></label>';
}

function ratioNote(b,r){
  var s;
  if(!r.isHub){
    s = 'редуктор '+fmt(r.gearbox,2)+' × цепь '+fmt(r.chain,2)+' = <b>'+fmt(r.ratio,2)+' : 1</b>';
  } else {
    s = 'прямой привод, передаточное <b>1 : 1</b>';
  }
  s += '<br>без ослабления поля: <b>'+f0(r.vNoFw)+' км/ч</b> · с ослаблением поля: <b>'+f0(r.vRpm)+' км/ч</b>';
  return s;
}

function renderTabs(){
  var h="";
  state.builds.forEach(function(b,i){
    var r=compute(b);
    h+='<div class="tab'+(i===state.active&&state.view==="build"?" on":"")+'">'+
       '<button class="go" data-act="tab" data-i="'+i+'"><span class="nm">'+esc(b.name)+'</span>'+
       '<span class="kw">'+fmt(r.pWheel/1000,1)+' кВт · '+f0(r.tWheelMax)+' Нм · '+f0(r.vTop)+' км/ч</span></button>'+
       (state.builds.length>1?'<button class="rm" data-act="del" data-i="'+i+'" title="Удалить сборку">×</button>':'')+
       '</div>';
  });
  h+='<button class="tab-add" data-act="add">+ сборка</button>';
  h+='<span class="saved" id="savedTag">'+(where?"хранится в: "+where:"")+'</span>';
  $("tabs").innerHTML=h;

  var cs="";
  ["₽","€","$"].forEach(function(c){ cs+='<button data-act="cur" data-v="'+c+'" class="'+(state.cur===c?"on":"")+'">'+c+'</button>'; });
  $("curSeg").innerHTML=cs;
  $("viewSeg").innerHTML='<button data-act="view" data-v="build" class="'+(state.view==="build"?"on":"")+'">Сборка</button>'+
    '<button data-act="view" data-v="cmp" class="'+(state.view==="cmp"?"on":"")+'">Сравнение</button>';
}

function renderCmp(){
  var all=state.builds.map(function(b){ return {b:b,r:compute(b)}; });
  var rows=[
    {k:"Мотор",v:function(x){return x.b.motor.label;},t:1},
    {k:"Контроллер",v:function(x){return x.b.ctrl.label;},t:1},
    {k:"Батарея",v:function(x){return f0(x.r.s)+"s · "+f0(N(x.b.batt.ah,0))+" А·ч · "+fmt(x.r.kwh,2)+" кВт·ч";},t:1},
    {k:"Напряжение номинальное",v:function(x){return fmt(x.r.vNom,1)+" В";},t:1},
    {k:"Передаточное",v:function(x){return fmt(x.r.ratio,2)+" : 1";},t:1},
    {k:"Мощность на колесе",v:function(x){return fmt(x.r.pWheel/1000,1)+" кВт";},n:function(x){return x.r.pWheel;}},
    {k:"Момент на колесе",v:function(x){return f0(x.r.tWheelMax)+" Нм";},n:function(x){return x.r.tWheelMax;}},
    {k:"Реализуемая тяга",v:function(x){return f0(x.r.fUse)+" Н";},n:function(x){return x.r.fUse;}},
    {k:"Скорость без ослабления поля",v:function(x){return f0(x.r.vNoFw)+" км/ч";},n:function(x){return x.r.vNoFw;}},
    {k:"Скорость с ослаблением поля",v:function(x){return f0(x.r.vRpm)+" км/ч";},n:function(x){return x.r.vRpm;}},
    {k:"Расчётная максималка",v:function(x){return f0(x.r.vTop)+" км/ч";},n:function(x){return x.r.vTop;}},
    {k:"0–100 км/ч",v:function(x){return x.r.t100?fmt(x.r.t100,1)+" с":"—";},n:function(x){return x.r.t100?-x.r.t100:-999;}},
    {k:"Подъём",v:function(x){return (x.r.grade>=99?"> 100":f0(x.r.grade))+" %";},n:function(x){return x.r.grade;}},
    {k:"Запас хода 70 км/ч",v:function(x){return f0(x.r.r70.km)+" км";},n:function(x){return x.r.r70.km;}},
    {k:"Масса с пилотом",v:function(x){return f0(x.r.mass)+" кг";},n:function(x){return -x.r.mass;}},
    {k:"Удельная мощность",v:function(x){return f0(x.r.wPerKg)+" Вт/кг";},n:function(x){return x.r.wPerKg;}},
    {k:"Смета",v:function(x){return money(x.r.total);},n:function(x){return x.r.total>0?-x.r.total:-1e12;}},
    {k:"Цена за кВт",v:function(x){return x.r.perKw>0?f0(x.r.perKw)+" "+state.cur:"—";},n:function(x){return x.r.perKw>0?-x.r.perKw:-1e12;}},
    {k:"Замечания",v:function(x){
        var red=x.r.warn.filter(function(w){return w.l==="red";}).length;
        var amb=x.r.warn.filter(function(w){return w.l==="amb";}).length;
        return red?red+" критичных":amb?amb+" предупреждений":"нет";},t:1}
  ];
  var h='<div class="cmp-in glass"><table><thead><tr><th class="k">Показатель</th>';
  all.forEach(function(x,i){ h+='<th><button class="cmp-open" data-act="tab" data-i="'+i+'">'+esc(x.b.name)+'</button></th>'; });
  h+='</tr></thead><tbody>';
  rows.forEach(function(row){
    var best=-1;
    if(!row.t && all.length>1){
      var vals=all.map(row.n), mx=Math.max.apply(null,vals);
      if(isFinite(mx)) best=vals.indexOf(mx);
    }
    h+='<tr><td class="k">'+row.k+'</td>';
    all.forEach(function(x,i){ h+='<td class="'+(i===best?"best":"")+'">'+esc(row.v(x))+'</td>'; });
    h+='</tr>';
  });
  h+='</tbody></table></div><div class="cmp-ft"><span>Лучшее в строке подсвечено. Для сметы и цены за киловатт лучшим считается меньшее.</span><button class="mini-b" data-act="reset">Очистить все сборки</button></div>';
  $("cmp").innerHTML=h;
}

document.addEventListener("input",function(e){
  var p=e.target.getAttribute("data-p");
  if(!p) return;
  set(p,e.target.value);
  renderOutputs(); renderTabs(); updateLiveHints(); scheduleSave();
});

document.addEventListener("change",function(e){
  var sel=e.target.getAttribute("data-sel");
  if(!sel) return;
  var b=cur(), v=e.target.value, i, p;
  if(sel==="motor"){
    for(i=0;i<MOTORS.length;i++) if(MOTORS[i].id===v) p=MOTORS[i];
    b.motor.preset=p.id; b.motor.label=p.label; b.motor.type=p.type; b.motor.kv=p.kv;
    b.motor.rPhase=p.rPhase; b.motor.maxRpm=p.maxRpm; b.motor.maxPhaseA=p.maxPhaseA;
    b.motor.contW=p.contW; b.motor.peakW=p.peakW; b.motor.kg=p.kg; b.motor.ratio=p.ratio;
    b.motor.tShaft=""; b.motor.tGear="";
    if(p.type!=="hub"){ b.trans.front=(p.front!==undefined?p.front:b.trans.front); b.trans.rear=(p.rear!==undefined?p.rear:b.trans.rear); }
  } else if(sel==="ctrl"){
    for(i=0;i<CONTROLLERS.length;i++) if(CONTROLLERS[i].id===v) p=CONTROLLERS[i];
    b.ctrl.preset=p.id; b.ctrl.label=p.label; b.ctrl.maxV=p.maxV;
    b.ctrl.maxPhaseA=p.maxPhaseA; b.ctrl.maxBattA=p.maxBattA; b.ctrl.kg=p.kg;
  } else if(sel==="chem"){
    for(i=0;i<CELLS.length;i++) if(CELLS[i].id===v) p=CELLS[i];
    b.batt.chem=p.id; b.batt.cellNom=p.nom; b.batt.cellMax=p.max; b.batt.cellMin=p.min;
  }
  renderAll(); scheduleSave();
});

document.addEventListener("click",function(e){
  var el=e.target.closest("[data-act]");
  if(!el) return;
  var a=el.getAttribute("data-act"), v=el.getAttribute("data-v"), i=parseInt(el.getAttribute("data-i"),10);
  var b=cur();
  if(a==="tab"){ state.active=i; state.view="build"; renderAll(); scheduleSave(); }
  else if(a==="add"){ var copy=JSON.parse(JSON.stringify(b)); copy.id=uid(); copy.name="Сборка "+(state.builds.length+1);
    state.builds.push(copy); state.active=state.builds.length-1; state.view="build"; renderAll(); scheduleSave(); }
  else if(a==="del"){ if(state.builds.length<2) return;
    state.builds.splice(i,1); state.active=Math.max(0,Math.min(state.active>i?state.active-1:state.active,state.builds.length-1));
    renderAll(); scheduleSave(); }
  else if(a==="cur"){ state.cur=v; renderAll(); scheduleSave(); }
  else if(a==="view"){ state.view=v; renderAll(); }
  else if(a==="mtype"){ b.motor.type=v; renderAll(); scheduleSave(); }
  else if(a==="soc"){ b.bike.soc=v; renderAll(); scheduleSave(); }
  else if(a==="adv"){ state.adv=!state.adv; renderInputs(); }
  else if(a==="xadd"){ b.extras.push({name:"",price:""}); renderInputs(); renderOutputs(); scheduleSave(); }
  else if(a==="xdel"){ b.extras.splice(i,1); renderInputs(); renderOutputs(); scheduleSave(); }
  else if(a==="reset"){ if(confirm(tr("Удалить все сборки и начать заново?"))){ state.builds=[makeBuild("Сборка 1")]; state.active=0; state.view="build"; renderAll(); saveNow(); } }
  else if(a==="lang"){ setLang(v); }
  else if(a==="ex"){ setEx(v); }
  else if(a==="print"){ renderSheet(); window.print(); }
  else if(a==="savefile"){ saveFile(); }
  else if(a==="json"){ download(pack(),"ev-build-"+stamp()+".json","application/json"); }
  else if(a==="import"){ $("file").click(); }
});

$("file").addEventListener("change",function(e){
  var f=e.target.files[0]; if(!f) return;
  var rd=new FileReader();
  rd.onload=function(){
    try{
      var txt=String(rd.result), data;
      if(/\.html?$/i.test(f.name)){
        var mm=txt.match(/<script id="seed" type="application\/json">([\s\S]*?)<\/script>/);
        data=mm?JSON.parse(mm[1]):null;
      } else data=JSON.parse(txt);
      if(apply(data)){ renderAll(); saveNow(); } else alert(tr("В файле нет сохранённых сборок."));
    }catch(err){ alert(tr("Файл не читается: ")+err.message); }
  };
  rd.readAsText(f);
  e.target.value="";
});

function stamp(){
  var d=new Date(), p=function(x){return String(x).padStart(2,"0");};
  return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"-"+p(d.getHours())+p(d.getMinutes());
}
function download(text,name,type){
  var blob=new Blob([text],{type:(type||"text/html")+";charset=utf-8"});
  var url=URL.createObjectURL(blob), a=document.createElement("a");
  a.href=url; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(url); a.remove(); },400);
}
function saveFile(){
  var wasEn=LANG==="en"; if(wasEn){ LANG="ru"; walk(document.body); }
  var clone=document.documentElement.cloneNode(true);
  var i, dyn=clone.querySelectorAll("[data-dyn]");
  for(i=0;i<dyn.length;i++) dyn[i].innerHTML="";
  clone.querySelector("#seed").textContent=pack().replace(/<\//g,"<\\/");
  download("<!DOCTYPE html>\n"+clone.outerHTML,"ev-build-"+stamp()+".html","text/html");
  if(wasEn){ LANG="en"; walk(document.body); mo.takeRecords(); }
}

/* ================================================================ */
boot();
renderAll();
saveNow();
mo.observe(document.body,{childList:true,subtree:true,characterData:true});
setEx(EXM); setLang(LANG);
</script>
